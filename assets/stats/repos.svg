<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-labelledby="t d">
<title id="t">Player stats de GitHub al 22 de agosto de 2026</title>
<desc id="d">322 repositorios públicos: 13 originales (4 por ciento) y 309 forks que funcionan como biblioteca de referencia.</desc>
<style>@font-face{font-family:JzOutfit;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:JzInter;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
.o{font-family:JzOutfit,Outfit,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.i{font-family:JzInter,Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.rise{animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade .5s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}
.flash{opacity:0;animation:flash .45s ease-out both}
.pt{opacity:0}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="xp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B35"/><stop offset="1" stop-color="#FFA500"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FF6B35" stroke-opacity=".07"/></pattern>
</defs>
<g class="rise" style="animation-delay:0.00s">
<rect x="1" y="1" width="398" height="218" rx="12" fill="#0A0A0A" stroke="#8A7E70" stroke-opacity=".7" stroke-width="1.5"/>
<path d="M1 30V13Q1 1 13 1H70" fill="none" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
<path d="M330 219H387Q399 219 399 207V190" fill="none" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
<text class="o" x="22.0" y="38.0" font-size="12" fill="#FF6B35" letter-spacing="2.2">PLAYER STATS // GITHUB</text>
<text class="o" x="378.0" y="38.0" font-size="12" fill="#B7B3AD" text-anchor="end" letter-spacing="1.5">22 AGO 2026</text>
<g class="pop" style="animation-delay:0.30s"><text class="o" x="22.0" y="96.0" font-size="48" fill="#FFFFFF">322</text></g>
<text class="i" x="115.0" y="94.0" font-size="16" fill="#B7B3AD">repositorios públicos</text>
<rect x="22" y="116" width="356" height="16" rx="8" fill="#161616" stroke="#8A7E70" stroke-opacity=".6"/>
<rect class="grow" style="animation-delay:0.60s" x="22" y="116" width="16.0" height="16" rx="8" fill="url(#xp)"/>
<circle cx="28" cy="162" r="6" fill="#FF6B35"/>
<text class="o" x="42.0" y="167.0" font-size="15" fill="#FFFFFF">13 originales</text>
<text class="i" x="133.3" y="167.0" font-size="15" fill="#B7B3AD">· 4%</text>
<circle cx="28" cy="192" r="6" fill="#8A7E70"/>
<text class="o" x="42.0" y="197.0" font-size="15" fill="#FFFFFF">309 forks</text>
